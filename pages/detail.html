<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090b12"><title>Skin detail — MLBB Skin Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"><link rel="stylesheet" href="../assets/css/style.css"></head>
<body><header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">S</span><span>SKIN<span class="brand-muted">LIBRARY</span></span></a><nav class="desktop-nav"><a href="../index.html">Library</a><a href="heroes.html">Heroes</a><a href="about.html">About</a></nav><a class="top-link" href="https://github.com/syariflab/mlbb-skin-library" target="_blank" rel="noreferrer">GitHub ↗</a><div class="header-actions"><button class="theme-toggle" type="button" aria-label="Aktifkan mode terang" title="Ganti tema"><span class="theme-track" aria-hidden="true"><span class="theme-thumb"><span class="theme-icon material-symbols-rounded">dark_mode</span></span></span></button><button class="menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="site-menu"><span></span><span></span><span></span></button></div>
<nav class="site-menu" id="site-menu" hidden><a href="../index.html">Library</a><a href="heroes.html">Heroes</a><a href="about.html">About</a></nav></header>
<nav class="mobile-nav" aria-label="Navigasi utama"><a href="../index.html" data-nav="library"><span>⌂</span><small>Library</small></a><a href="heroes.html" data-nav="heroes"><span>♙</span><small>Heroes</small></a><a href="about.html" data-nav="about"><span>ⓘ</span><small>About</small></a></nav>
<main class="page-shell"><div class="breadcrumb"><a href="../index.html">Library</a> / Skin detail</div><article class="detail-panel" id="detail"><div class="eyebrow">SKIN INFORMATION</div><h1>Memuat detail...</h1><p class="page-copy">Sedang mengambil informasi koleksi.</p></article></main>
<footer><a class="brand footer-brand" href="../index.html"><span class="brand-mark" aria-hidden="true">S</span><span>SKIN<span class="brand-muted">LIBRARY</span></span></a><span>Independent community project · 2026</span><a href="../index.html">Back to library ↑</a></footer>
<script>
const target=document.querySelector("#detail");
const id=new URLSearchParams(location.search).get("id");
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const savedKey="mlbb-skin-library-saved";
function getSaved(){try{return JSON.parse(localStorage.getItem(savedKey)||"[]")}catch{return[]}}
function renderSaveButton(){const button=document.querySelector("#save-skin");if(!button)return;const saved=getSaved().includes(id);button.innerHTML=(saved?'<span class="save-bookmark" aria-hidden="true">▮</span> Undo Save':'<span class="save-bookmark" aria-hidden="true">▯</span> Save');button.setAttribute("aria-pressed",String(saved));button.classList.toggle("is-saved",saved)}
Promise.all([fetch("../data/skins.json").then(r=>{if(!r.ok)throw Error();return r.json()}),fetch("../data/contributors.json").then(r=>{if(!r.ok)throw Error();return r.json()})]).then(([items,contributors])=>{
 const item=items.find(x=>x.id===id);
 if(!item){target.innerHTML='<div class="eyebrow">NOT FOUND</div><h1>Koleksi tidak ditemukan.</h1><p class="page-copy">Data mungkin belum tersedia atau tautan tidak valid.</p><a class="primary-button" href="../index.html#library">Kembali ke katalog ↗</a>';return;}
 const contributor=contributors.find(x=>x.id===item.contributorId)||contributors[0];
 document.title=item.name+" — MLBB Skin Library";
 const contributorMarkup=contributor?'<section class="contributor-card" aria-label="Informasi kontributor"><img class="contributor-avatar" src="../'+safe(contributor.avatar)+'" alt="Foto profil '+safe(contributor.name)+'"><div class="contributor-details"><div class="contributor-topline"><a class="contributor-name" href="'+safe(contributor.profileUrl)+'" target="_blank" rel="noopener noreferrer">'+safe(contributor.name)+'</a><span class="contributor-separator" aria-hidden="true">|</span><button class="save-skin-button" id="save-skin" type="button" aria-pressed="false">Save</button></div><div class="contributor-updated"><span>Last updated:</span><strong>'+safe(item.lastUpdated||item.updatedAt||"Belum dicatat")+'</strong></div></div></section>':'';
 target.innerHTML='<div class="eyebrow">SKIN INFORMATION</div><h1>'+safe(item.name)+'</h1><p class="page-copy">'+safe(item.hero)+'</p><div class="detail-meta"><span>'+safe(item.type)+'</span><span>'+safe(item.status||"Informasi")+'</span><span>'+safe(item.release||"")+'</span></div><p class="page-copy">'+safe(item.description||"Belum ada deskripsi untuk koleksi ini.")+'</p><div class="detail-note">Halaman ini berisi informasi katalog. Tidak ada file modifikasi game atau tautan bypass proteksi yang disediakan.</div>'+contributorMarkup+'<a class="primary-button" href="../index.html#library">Kembali ke katalog ↗</a>';
 const saveButton=document.querySelector("#save-skin");if(saveButton){renderSaveButton();saveButton.addEventListener("click",()=>{const saved=getSaved();const next=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem(savedKey,JSON.stringify(next));renderSaveButton()})}
}).catch(()=>{target.innerHTML='<h1>Data tidak dapat dimuat.</h1><p class="page-copy">Periksa koneksi lalu coba lagi.</p>';});
</script><script src="../assets/js/theme.js"></script></body></html>
