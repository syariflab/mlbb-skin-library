<script>
const target=document.querySelector("#detail");const id=new URLSearchParams(location.search).get("id");const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("../data/skins.json").then(r=>r.json()).then(items=>{const item=items.find(x=>x.id===id);if(!item){target.innerHTML='<div class="eyebrow">NOT FOUND</div><h1>Koleksi tidak ditemukan.</h1><p class="page-copy">Data mungkin belum tersedia atau tautan tidak valid.</p><a class="primary-button" href="../index.html#library">Kembali ke katalog ↗</a>';return;}document.title=item.name+" — MLBB Skin Library";target.innerHTML='<div class="eyebrow">SKIN INFORMATION</div><h1>'+safe(item.name)+'</h1><p class="page-copy">'+safe(item.hero)+'</p><div class="detail-meta"><span>'+safe(item.type)+'</span><span>'+safe(item.status||"Informasi")+'</span><span>'+safe(item.release||"")+'</span></div><p class="page-copy">'+safe(item.description||"Belum ada deskripsi untuk koleksi ini.")+'</p><div class="detail-note">Halaman ini berisi informasi katalog. Tidak ada file modifikasi game atau tautan bypass proteksi yang disediakan.</div><a class="primary-button" href="../index.html#library">Kembali ke katalog ↗</a>';}).catch(()=>{target.innerHTML='<h1>Data tidak dapat dimuat.</h1><p class="page-copy">Periksa koneksi lalu coba lagi.</p>';});
</script></body></html>
